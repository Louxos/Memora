# Publication de la page d'archive Memora sur GitHub Pages.
#
# Les fichiers de `site/` sont des modèles : `scripts/build_site.py` résout
# leurs marqueurs et produit `docs/`, un site 100 % statique (CSS inline,
# aucune ressource distante). `docs/` est versionné : le mode le plus simple
# de publication reste « Deploy from a branch → main → /docs ».
#
# Activer Pages demande une permission que ni le token de l'agent ni le
# GITHUB_TOKEN du workflow ne possèdent (403 à l'API). Le workflow vérifie
# donc l'état du site : s'il est activé, il déploie via l'API depuis `main` ;
# sinon il avertit sans échouer, et la publication par branche reste prête.

name: GitHub Pages — archive Memora

on:
  push:
    branches:
      - main
      - arena/7081a176-memora
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construire et vérifier le site statique
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer docs/ depuis les modèles
        run: python3 scripts/build_site.py

      - name: Vérifier le rendu
        run: |
          test -s docs/index.html
          test -s docs/404.html
          test -s docs/favicon.svg
          ! grep -F -q '{{' docs/index.html
          ! grep -F -q '{{' docs/404.html

      - name: Vérifier si GitHub Pages est activé
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          echo "GET /pages : $code"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages n'est pas activé. Réglage unique : Settings > Pages > Deploy from a branch > main > /docs (dossier déjà publié). Pour le mode GitHub Actions, activer la source puis relancer ce workflow."
          fi

      - name: Configurer GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Déposer l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publier via l'API GitHub Pages
    # L'environnement github-pages est protégé : seuls les déploiements depuis
    # la branche par défaut sont acceptés. On n'essaie que si Pages est actif.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
