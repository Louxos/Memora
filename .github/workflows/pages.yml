# Publication de la page d'archive Memora sur GitHub Pages.
#
# Les fichiers de `site/` sont des modèles : `scripts/build_site.py` résout
# leurs marqueurs et produit `docs/`, un site 100 % statique (CSS inline,
# aucune ressource distante). `docs/` est versionné : le mode le plus simple
# de publication reste « Deploy from a branch → main → /docs ».
#
# Ce workflow reconstruit et vérifie le site à chaque modification, puis tente
# un déploiement via l'API Pages depuis la branche par défaut. L'activation de
# Pages demande une permission que le token d'automatisation ne possède pas :
# si Pages n'est pas encore activé, le déploiement échoue en avertissement
# (sans faire échouer le workflow) et la publication par branche reste
# disponible dès que Pages est activé dans les paramètres du dépôt.

name: GitHub Pages — archive Memora

on:
  push:
    branches:
      - main
      - arena/7081a176-memora
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construire et vérifier le site statique
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer docs/ depuis les modèles
        run: python3 scripts/build_site.py

      - name: Vérifier le rendu
        run: |
          test -s docs/index.html
          test -s docs/404.html
          test -s docs/favicon.svg
          ! grep -F -q '{{' docs/index.html
          ! grep -F -q '{{' docs/404.html

      # Le site Pages n'existe pas encore à la première exécution : on essaie
      # de le créer en mode Actions avec le GITHUB_TOKEN du workflow (qui
      # demande pages:write plus haut). Si le token n'a pas le droit, l'étape
      # échoue en avertissement et l'activation reste à faire à la main.
      - name: Activer GitHub Pages (si le token le permet)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          echo "GET /pages : $code"
          if [ "$code" != "200" ]; then
            post=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}')
            echo "POST /pages : $post"
            cat /tmp/pages-post.json
            case "$post" in
              200|201|204) echo "::notice::GitHub Pages activé en mode GitHub Actions." ;;
              *) echo "::warning::Activation de Pages refusée ($post) : à faire dans Settings > Pages > Deploy from a branch > main > /docs." ;;
            esac
          fi

      - name: Configurer GitHub Pages (si activé)
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Déposer l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publier via l'API GitHub Pages
    # L'environnement github-pages est protégé : seuls les déploiements depuis
    # la branche par défaut sont acceptés.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Avertissement si Pages n'est pas activé
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Déploiement API impossible. Activez GitHub Pages dans Settings > Pages : « Deploy from a branch > main > /docs » (le dossier docs/ est déjà publié) ou « GitHub Actions », puis relancez ce workflow."
