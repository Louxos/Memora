# Publication de la page d'archive Memora sur GitHub Pages.
#
# Les fichiers de `site/` sont des modèles : `scripts/build_site.py` résout
# leurs marqueurs et produit `docs/`, un site 100 % statique (CSS inline,
# aucune ressource distante). `docs/` est versionné : le mode le plus simple
# de publication reste « Deploy from a branch → main → /docs ».
#
# Ce workflow reconstruit et vérifie le site à chaque modification. Il tente
# aussi un déploiement via l'API Pages depuis la branche par défaut ; si Pages
# n'est pas activé (ou si le token ne peut pas l'activer), le déploiement est
# simplement sauté : la construction reste verte et la publication par branche
# continue de fonctionner.

name: GitHub Pages — archive Memora

on:
  push:
    branches:
      - main
      - arena/7081a176-memora
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construire et vérifier le site statique
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages_ready.outputs.ready }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer docs/ depuis les modèles
        run: python3 scripts/build_site.py

      - name: Vérifier le rendu
        run: |
          test -s docs/index.html
          test -s docs/404.html
          test -s docs/favicon.svg
          ! grep -F -q '{{' docs/index.html
          ! grep -F -q '{{' docs/404.html

      # L'activation de Pages peut être refusée (token en lecture seule,
      # site pas encore créé). On ne fait jamais échouer la construction pour
      # cela : « Deploy from a branch » reste disponible dans tous les cas.
      - name: Configurer GitHub Pages (si possible)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Signaler que Pages est prêt
        id: pages_ready
        if: steps.pages.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Déposer l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publier via l'API GitHub Pages
    # L'environnement github-pages est protégé : seuls les déploiements depuis
    # la branche par défaut sont acceptés. On n'essaie que si Pages est actif.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
